name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d894e9dddfe3e0
      - name: version sync (VERSION vs pyproject)
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          grep -q "version = \"${v}\"" pyproject.toml || {
            echo "pyproject.toml version != VERSION (${v})"; exit 1; }
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
